name: Validate Theme Collection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional author tooling dependency
        run: python -m pip install Pillow
      - name: Validate theme package
        run: python tools/theme_tool.py validate --root .
      - name: Host regression tests
        run: python -m unittest discover -s tests -q
      - name: Verify archive is install-only
        run: python tools/theme_tool.py pack --root . --output dist/halo-0.1.0.crosspoint-theme.zip
