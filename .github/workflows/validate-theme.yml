name: Validate SD theme package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pillow
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -q
      - name: Validate every manifest resource and font section
        run: python tools/theme_tool.py validate --root .
      - name: Check version for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c "import json, os; version = json.load(open('halo.crosspoint-theme/manifest.json', encoding='utf-8'))['version']; tag = os.environ['GITHUB_REF_NAME']; assert tag == 'v' + version, f'tag {tag} != manifest v{version}'"
      - name: Build validated, install-only ZIP
        run: python tools/theme_tool.py pack --root . --output dist/halo-validated.crosspoint-theme.zip
      - name: Retain verified ZIP only for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: verified-theme-${{ github.ref_name }}
          path: dist/halo-validated.crosspoint-theme.zip
          if-no-files-found: error
