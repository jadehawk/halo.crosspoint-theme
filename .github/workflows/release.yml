name: Release HALO device-specific themes

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate version, artwork and both device packages
        run: |
          python - <<'PY'
          import json
          import os
          version = json.load(open("halo.crosspoint-theme/manifest.json", encoding="utf-8"))["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Release tag must match manifest version"
          PY
          python tools/theme_tool.py validate --root .
          python -m unittest discover -s tests -q
      - name: Build both native-resolution installable ZIPs
        run: python tools/pack_theme_variants.py
      - name: Publish both assets under one versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/halo-x3-${VERSION}.crosspoint-theme.zip" \
            "dist/halo-x4plus-${VERSION}.crosspoint-theme.zip" \
            --title "HALO Theme Collection v${VERSION}" --notes-file CHANGELOG.md --verify-tag
